sonar.projectKey=danstis_read2burn
sonar.organization=danstis

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=read2burn

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# Set explicitly: without it the scanner analysed the test folder only and no application
# source (lib/, routes/, app.js) was indexed at all. The test folder is excluded from
# the source scope below so that main and test files stay disjoint sets.
sonar.sources=.

# Test sources are analysed as test code, not as production code.
sonar.tests=test
sonar.test.inclusions=test/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# The generated coverage report is build output, not source code.
sonar.exclusions=test/**,coverage/**

# Coverage from "npm run test:coverage" (uploaded as an artifact by the CI test job)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,public/**
